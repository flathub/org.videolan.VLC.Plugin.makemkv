id: org.videolan.VLC.Plugin.makemkv
build-extension: true
runtime: org.videolan.VLC
runtime-version: stable
branch: 3-25.08
sdk: org.freedesktop.Sdk//25.08
tags:
  - proprietary
build-options:
  env:
    V: '1'
modules:
  - name: makemkv-bin
    buildsystem: simple
    build-commands:
      - mkdir -p tmp
      - echo accepted > tmp/eula_accepted
      - make PREFIX=/app/share/vlc/extra/makemkv install
      - install -Dp -m 644 src/eula_en_linux.txt --target-directory=/app/share/vlc/extra/makemkv/share/licenses
    sources:
      - type: archive
        url: https://www.makemkv.com/download/makemkv-bin-1.18.4.tar.gz
        sha256: cee56de0baa5531abed16bd862742d308d772b4ab4dae16ee865bf74f04a1608
        x-checker-data:
          type: html
          url: https://www.makemkv.com/download
          version-pattern: MakeMKV v([\d\.]*)
          url-template: https://www.makemkv.com/download/makemkv-bin-$version.tar.gz
  - name: makemkv-oss
    config-opts:
      - --with-pic
      - --enable-shared
      - --disable-static
      - --disable-gui
      - --prefix=/app/share/vlc/extra/makemkv
      - DESTDIR=/
      - ffmpeg_CFLAGS=-I/app/include
    post-install:
      - install -Dp -m 644 License.txt --target-directory=/app/share/vlc/extra/makemkv/share/licenses
      - install -Dp -m 644 org.videolan.VLC.Plugin.makemkv.metainfo.xml --target-directory=${FLATPAK_DEST}/share/metainfo
    sources:
      - type: archive
        url: https://www.makemkv.com/download/makemkv-oss-1.18.4.tar.gz
        sha256: 8590063648d42ec2a958b74573d7022f0f4c334e4e4fe7dd53b70c6e748ba453
        x-checker-data:
          type: html
          url: https://www.makemkv.com/download
          version-pattern: MakeMKV v([\d\.]*)
          url-template: https://www.makemkv.com/download/makemkv-oss-$version.tar.gz
      - type: file
        path: org.videolan.VLC.Plugin.makemkv.metainfo.xml
  - name: envvars
    buildsystem: simple
    build-commands:
      - mv makemkv-env.sh /app/share/vlc/extra/makemkv
    sources:
      - type: file
        path: makemkv-env.sh

